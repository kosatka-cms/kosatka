# Databases, an S3-compatible storage (SeaweedFS) and Azure Blob Storage
# (the Azurite emulator) for the integration
# tests (go test -tags dbintegration): scripts/test_db.sh starts them,
# runs the tests and stops them.
# Ports are offset so they don't clash with a local MySQL/PostgreSQL.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["33306:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest"]
      interval: 2s
      retries: 60
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    ports: ["35432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 60
  s3:
    image: chrislusf/seaweedfs:4.45
    # -ip: the master, the volume server and the filer of the one
    # container find each other on the loopback (left to detect its
    # address, the volume server never joined the master on a CI runner:
    # no volumes, every write failed); -ip.bind: served on every address.
    command: ["server", "-s3", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test-secret
    ports: ["39000:8333"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 2s
      retries: 60
  azure:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--inMemoryPersistence"]
    ports: ["31000:10000"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 2s
      retries: 60
