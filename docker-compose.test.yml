# The databases for the integration tests (go test -tags dbintegration): scripts/test_db.sh starts them,
# runs the tests and stops them.
# Ports are offset so they don't clash with a local MySQL/PostgreSQL.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["33306:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest"]
      interval: 2s
      retries: 60
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    ports: ["35432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 60
