    <clipPath id="kosatka-fin"><rect x="78" y="0" width="122" height="102"/></clipPath>
  </defs>
  <rect x="16" y="16" width="168" height="168" rx="40" fill="#062033"/>
  <path d="M78 62 C98 48 124 40 146 40 C120 56 100 80 82 100 L78 100Z" fill="#22d3ee" stroke="#22d3ee" stroke-width="12" stroke-linejoin="round" clip-path="url(#kosatka-fin)"/>
  <path d="M78 102 L104 102 L152 156 H122Z" fill="#fff"/>
  <rect x="54" y="44" width="24" height="112" rx="3" fill="#fff"/>
</svg>
